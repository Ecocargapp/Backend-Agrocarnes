# Nginx — server blocks para Agrocarnes, en la MISMA t3.micro pero separados
# de los de AgroSoft (agrofranpabel.com). Ajusta los dominios si defines unos
# propios para Agrocarnes/Restaurante/D'Monsa; mientras tanto puedes usar
# subdominios temporales de agrofranpabel.com.
#
# Copiar a /etc/nginx/sites-available/agrocarnes.conf, luego:
#   sudo ln -s /etc/nginx/sites-available/agrocarnes.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d agrocarnes.agrofranpabel.com -d api-agrocarnes.agrofranpabel.com

server {
    listen 80;
    server_name api-agrocarnes.agrofranpabel.com;

    location / {
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name agrocarnes.agrofranpabel.com;

    root /var/www/app-agrocarnes;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
